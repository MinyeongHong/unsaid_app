name: unsaid_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.1+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # required util
  intl: any
  hive: ^2.2.3
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  package_info_plus: ^9.0.0
  # flutter_app_badger: ^1.5.0
  # permission_handler: ^11.3.1

  # required widget
  flash: ^3.1.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_svg: ^2.2.2
  webview_flutter: ^4.8.0
  flutter_spinkit: ^5.2.1
  flutter_native_splash: ^2.4.0

   # required firebase
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.1
  firebase_messaging: ^16.1.1
  firebase_crashlytics: ^5.0.7

  # optional sign in
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  build_runner: ^2.11.1
  json_serializable: ^6.12.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/icons/zodiac/
    - assets/images/
    - assets/lotties/
    - .env

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.otf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900

flutter_launcher_icons:
  ios: true
  remove_alpha_ios: true
  android: "launcher_icon"
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  web: false
  fullscreen: true
  background_image: "assets/images/app_splash.png"
